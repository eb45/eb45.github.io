<style>
.home h1 {
  text-align: center;
  text-transform: uppercase;
  color: #4CAF50;
  margin-top: 0;
  margin-bottom: 0;
  font-family: "Courier New", serif;
  font-size: clamp(4rem, 18vw, 120pt);
  font-weight: normal;
  font-style: italic;
}

.fade-in img {
  margin: 0;
  display: block;
  width: 100%;
}

div.slide-left {
  width:100%;
  overflow:hidden;
}
div.slide-left p {
  animation: slide-left 12s;
}

@keyframes slide-left {
  from {
    margin-left: 100%;
    width: 100%;
  }

  to {
    margin-left: 0%;
    width: 100%;
  }
}

.fade-in {
animation: fadeIn ease 10s;
-webkit-animation: fadeIn ease 10s;
-moz-animation: fadeIn ease 10s;
-o-animation: fadeIn ease 10s;
-ms-animation: fadeIn ease 10s;
}
@keyframes fadeIn {
0% {opacity:0;}
100% {opacity:1;}
}

@-moz-keyframes fadeIn {
0% {opacity:0;}
100% {opacity:1;}
}

@-webkit-keyframes fadeIn {
0% {opacity:0;}
100% {opacity:1;}
}

@-o-keyframes fadeIn {
0% {opacity:0;}
100% {opacity:1;}
}

@-ms-keyframes fadeIn {
0% {opacity:0;}
100% {opacity:1;}
}

</style>

<div class="home">
    <h1>HELLO</h1>
</div>

<div class="fade-in">
<img src="{{ '/img/background.jpg' | relative_url }}" alt="background" style="width:100%">
</div>
